services:
  - type: web
    name: canterlot-api
    runtime: python
    plan: free
    branch: main
    autoDeploy: false
    buildCommand: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      export PATH="$HOME/.local/bin:$PATH"
      uv sync --frozen --no-dev
    startCommand: uv run uvicorn canterlot.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - fromGroup: canterlot-shared-env
      - key: DB__REDIS_URL
        fromService:
          type: redis
          name: canterlot-redis
          property: connectionString

  - type: worker
    name: canterlot-worker
    runtime: python
    plan: free
    branch: main
    autoDeploy: false
    buildCommand: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      export PATH="$HOME/.local/bin:$PATH"
      uv sync --frozen --no-dev
    startCommand: uv run start-worker
    envVars:
      - fromGroup: canterlot-shared-env
      - key: DB__REDIS_URL
        fromService:
          type: redis
          name: canterlot-redis
          property: connectionString

  - type: redis
    name: canterlot-redis
    plan: free
    ipAllowList: []

envVarGroups:
  - name: canterlot-shared-env
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: CORS_ORIGINS
        value: '["https://canterlot.com.br"]'
      - key: FRONTEND_URL
        value: "https://canterlot.com.br"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # --- AUTH SETTINGS ---
      - key: AUTH__JWT_SECRET_KEY
        generateValue: true
      - key: AUTH__CURRENT_TERMS_VERSION
        value: "1"
      - key: AUTH__CURRENT_PRIVACY_VERSION
        value: "1"

      # --- EMAIL SETTINGS ---
      - key: EMAIL__RESEND_API_KEY
        sync: false
      - key: EMAIL__RESEND_WEBHOOK_SECRET
        sync: false
      - key: EMAIL__DRY_RUN
        value: "false"
      - key: EMAIL__DISPATCH_MAX_RPS
        value: "5"

      # --- DATABASE SETTINGS ---
      - key: DB__MONGODB_URL
        sync: false
      - key: DB__MONGODB_DB_NAME
        value: canterlot_db

      # --- GATEWAY SETTINGS ---
      - key: GATEWAYS__GOOGLE_BOOKS_API_KEY
        sync: false
      - key: GATEWAYS__GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GATEWAYS__GRAVATAR_OAUTH_CLIENT_ID
        sync: false
      - key: GATEWAYS__GRAVATAR_OAUTH_CLIENT_SECRET
        sync: false
